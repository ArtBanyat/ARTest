<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- === สคริปต์บังคับแก้ปัญหาถ่ายรูปไม่ติดโมเดล (Force Preserve Drawing Buffer) === -->
    <!-- ต้องวางไว้ "ก่อน" โหลด A-Frame -->
    <script>
      (function() {
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(type, attributes, ...args) {
          if (type === 'webgl' || type === 'webgl2') {
            attributes = attributes || {};
            attributes.preserveDrawingBuffer = true; // บังคับให้เป็น true เสมอ
          }
          return originalGetContext.call(this, type, attributes, ...args);
        };
      })();
    </script>
    
    <!-- โหลดไลบรารี AR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      
      /* ตกแต่งปุ่มชัตเตอร์ */
      #capture-btn {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        width: 70px;
        height: 70px;
        background-color: rgba(255, 255, 255, 0.5);
        border: 4px solid white;
        border-radius: 50%;
        z-index: 1000;
        cursor: pointer;
        display: none; /* ซ่อนไว้จนกว่ากล้องจะพร้อม */
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      }
      #capture-btn:active {
        background-color: rgba(255, 255, 255, 0.9);
      }
    </style>
  </head>
  <body>
    
    <!-- ปุ่มถ่ายรูป -->
    <button id="capture-btn"></button>

    <!-- 
      ตั้งค่า Scene: 
      uiLoading/Scanning: no (ปิดกรอบสแกน)
      renderer: ถึงใส่ preserveDrawingBuffer: true ตรงนี้แล้ว บางทีเบราว์เซอร์ก็ละเลย 
      (จึงต้องใช้สคริปต์บังคับที่ด้านบนสุดเสริม)
    -->
    <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no;" 
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- เปลี่ยน your-model.glb เป็นไฟล์ของคุณ -->
        <a-asset-item id="myModel" src="./Singha3d.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- ปรับแต่ง rotation/position/scale ตามต้องการ -->
        <a-gltf-model 
          src="#myModel" 
          position="0 0 0" 
          scale="1 1 1" 
          rotation="-90 180 0"
        ></a-gltf-model>
      </a-entity>
    </a-scene>

    <!-- สคริปต์ปุ่มถ่ายรูป (ไม่มีการเปลี่ยนแปลง) -->
    <script>
      const captureBtn = document.getElementById('capture-btn');
      
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('arReady', () => {
        captureBtn.style.display = 'block';
      });

      captureBtn.addEventListener('click', () => {
        const video = document.querySelector('video');
        const canvas = document.querySelector('canvas');
        
        if (!video || !canvas) return;

        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const ctx = tempCanvas.getContext('2d');

        const videoRatio = video.videoWidth / video.videoHeight;
        const canvasRatio = canvas.width / canvas.height;
        let drawWidth, drawHeight, startX, startY;

        if (videoRatio > canvasRatio) {
            drawHeight = canvas.height;
            drawWidth = canvas.height * videoRatio;
            startX = (canvas.width - drawWidth) / 2;
            startY = 0;
        } else {
            drawWidth = canvas.width;
            drawHeight = canvas.width / videoRatio;
            startX = 0;
            startY = (canvas.height - drawHeight) / 2;
        }

        // 1. วาดพื้นหลัง (กล้อง)
        ctx.drawImage(video, startX, startY, drawWidth, drawHeight);
        // 2. วาดโมเดล 3D ทับลงไป
        ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height);

        // เซฟภาพ
        const link = document.createElement('a');
        link.download = 'AR-Photo.png';
        link.href = tempCanvas.toDataURL('image/png');
        link.click();
      });
    </script>
  </body>
</html>
